name: Staging Seed (Test Providers & Users)

on:
  workflow_dispatch:

concurrency:
  group: staging-seed
  cancel-in-progress: false

jobs:
  seed:
    name: Seed staging test data
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Guard — refuse to run outside the staging branch
        run: |
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "github.sha=${{ github.sha }}"

          if [ "${{ github.ref_name }}" != "staging" ]; then
            echo "::error::This workflow may only run from the 'staging' branch. Got: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Validate required secrets are present
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          missing=0

          for name in STAGING_SUPABASE_URL STAGING_SUPABASE_SERVICE_ROLE_KEY STAGING_SUPABASE_PROJECT_REF STAGING_SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            else
              echo "ok: $name is set"
            fi
          done

          if [ "$missing" = "1" ]; then
            exit 1
          fi

      - name: Safe diagnostics (no secret values)
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          host="${STAGING_SUPABASE_URL#https://}"
          host="${host#http://}"
          url_project_ref="${host%%.*}"

          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "sha=${{ github.sha }}"
          echo "supabase_project_ref=${url_project_ref}"

          if [[ "$url_project_ref" == "qfjgifubavuomwvroahy" ]] || [[ "$STAGING_SUPABASE_PROJECT_REF" == "qfjgifubavuomwvroahy" ]]; then
            echo "::error::Refusing to run — staging secrets point at the production project."
            exit 1
          fi

          if [[ "$url_project_ref" != "$STAGING_SUPABASE_PROJECT_REF" ]]; then
            echo "::error::STAGING_SUPABASE_URL project ref does not match STAGING_SUPABASE_PROJECT_REF."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps (for TS seed)
        run: bun install --frozen-lockfile || bun install

      - name: Run SQL seed — providers (idempotent)
        env:
          PGHOST: db.${{ secrets.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          psql \
            -v ON_ERROR_STOP=1 \
            -f staging-validation/seed/test-providers.sql

      - name: Run TS seed — test users (idempotent)
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          bun run staging-validation/seed/create-test-users.ts 2>&1 \
            | grep -viE 'password|service[_-]?role|bearer|apikey|api[_-]?key' \
            || true

      - name: Verify seeded data (read-only)
        id: verify
        env:
          PGHOST: db.${{ secrets.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          mkdir -p artifact

          {
            echo "# Staging Seed Report"
            echo "commit: ${{ github.sha }}"
            echo "ref: ${{ github.ref_name }}"
            echo ""
            echo "## Providers per country"
          } > artifact/seed-report.md

          psql \
            -v ON_ERROR_STOP=1 \
            -A \
            -F'|' \
            -t \
            -c "select country_code, count(*) from public.provider_profiles where is_test_seed = true group by country_code order by country_code;" \
            > artifact/counts.txt

          echo '| country | count |' >> artifact/seed-report.md
          echo '|---------|-------|' >> artifact/seed-report.md

          awk -F'|' \
            '{printf "| %s | %s |\n",$1,$2}' \
            artifact/counts.txt \
            >> artifact/seed-report.md

          total=$(psql \
            -v ON_ERROR_STOP=1 \
            -A \
            -t \
            -c "select count(*) from public.provider_profiles where is_test_seed = true;")

          mette=$(psql \
            -v ON_ERROR_STOP=1 \
            -A \
            -t \
            -c "select count(*) from public.provider_profiles where slug = 'mette-copenhagen';")

          total=$(echo "$total" | xargs)
          mette=$(echo "$mette" | xargs)

          echo "" >> artifact/seed-report.md
          echo "total_seeded=$total" >> artifact/seed-report.md
          echo "mette_copenhagen_present=$mette" >> artifact/seed-report.md

          echo "--- counts ---"
          cat artifact/counts.txt
          echo "total=$total  mette=$mette"

          expect() {
            local cc="$1"
            local want="$2"
            local got

            got=$(awk -F'|' -v c="$cc" '$1==c{print $2}' artifact/counts.txt)
            got=$(echo "${got:-0}" | xargs)

            if [ "$got" != "$want" ]; then
              echo "::error::Country $cc expected $want, got $got"
              return 1
            fi
          }

          fail=0

          expect DK 5 || fail=1
          expect SE 3 || fail=1
          expect DE 3 || fail=1
          expect ES 3 || fail=1
          expect GB 3 || fail=1

          if [ "$total" != "17" ]; then
            echo "::error::Total expected 17, got $total"
            fail=1
          fi

          if [ "$mette" != "1" ]; then
            echo "::error::Provider 'mette-copenhagen' missing"
            fail=1
          fi

          exit "$fail"

      - name: Upload sanitized seed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-seed-report
          path: artifact/seed-report.md
          if-no-files-found: warn
