name: Staging Deploy (Supabase)

# Manual only. Never runs on push. Never targets production.
"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-staging" to confirm.'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Link + push migrations + deploy edge functions
    runs-on: ubuntu-latest
    # Hard guard: this workflow only runs on the staging branch.
    if: ${{ github.ref == 'refs/heads/staging' }}
    timeout-minutes: 30

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_REF:           ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

    steps:
      - name: Confirm input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-staging" ]; then
            echo "::error::Confirmation phrase not provided. Aborting."
            exit 1
          fi

      - name: Refuse if not on staging branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/staging" ]; then
            echo "::error::This workflow only runs on the 'staging' branch (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Refuse if required secrets missing
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::STAGING_SUPABASE_ACCESS_TOKEN is missing"; missing=1; }
          [ -n "$STAGING_REF" ] || { echo "::error::STAGING_SUPABASE_PROJECT_REF is missing"; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::STAGING_SUPABASE_DB_PASSWORD is missing"; missing=1; }
          if [ "$missing" = "1" ]; then
            exit 1
          fi


      - name: Refuse if project ref matches production
        run: |
          PROD_REF="qfjgifubavuomwvroahy"
          if [ "$STAGING_REF" = "$PROD_REF" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF equals the production ref. Aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show CLI version
        run: supabase --version

      - name: Link staging project
        run: |
          supabase link --project-ref "$STAGING_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: |
          set -o pipefail
          supabase db push --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee db-push.log
          if [ "${PIPESTATUS[0]}" != "0" ]; then
            echo "::error::supabase db push failed. See db-push.log."
            exit 1
          fi

      - name: Deploy all edge functions
        run: |
          set -o pipefail
          # Deploy every function found under supabase/functions/*
          shopt -s nullglob
          fns=()
          for d in supabase/functions/*/; do
            name="$(basename "$d")"
            case "$name" in
              # _shared/tests/node_modules: not deployable functions.
              # mcp: auto-generated by the @lovable.dev/mcp-js Vite plugin at
              # frontend build time; the committed bundle bakes in the
              # PRODUCTION Supabase project ref as its OAuth issuer, so pushing
              # it to staging would misconfigure auth. It is a Lovable-agent
              # MCP server, not part of any customer flow or staging scenario,
              # so it is intentionally skipped here.
              _*|tests|node_modules|mcp) continue ;;
            esac
            fns+=("$name")
          done
          if [ "${#fns[@]}" = "0" ]; then
            echo "::error::No edge functions found under supabase/functions/*."
            exit 1
          fi
          echo "Deploying ${#fns[@]} functions..."
          failed=()
          for name in "${fns[@]}"; do
            echo "::group::deploy $name"
            if ! supabase functions deploy "$name" --project-ref "$STAGING_REF"; then
              failed+=("$name")
              echo "::error::Function deploy failed: $name"
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" != "0" ]; then
            echo "::error::${#failed[@]} function(s) failed: ${failed[*]}"
            exit 1
          fi

      - name: List deployed functions (verification)
        run: supabase functions list --project-ref "$STAGING_REF"

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-log
          path: db-push.log
          if-no-files-found: ignore
          retention-days: 14
