name: Campaign Applications P0 — Targeted Staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type deploy-staging"
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply-and-verify:
    name: Apply and verify P0 on staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref_name == 'staging'
    env:
      EXPECTED_STAGING_REF: acxtqclnrvpyncmtptdd
      PROD_REF: qfjgifubavuomwvroahy
      STAGING_PG_CONN: ${{ secrets.STAGING_PG_CONN }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

    steps:
      - name: Confirm input
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "deploy-staging" || {
            echo "::error::Confirmation phrase must be deploy-staging"
            exit 1
          }

      - name: Refuse wrong target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_PG_CONN"
          test -n "$STAGING_SUPABASE_PROJECT_REF"
          test "$STAGING_SUPABASE_PROJECT_REF" = "$EXPECTED_STAGING_REF" || {
            echo "::error::Unexpected staging project ref"
            exit 1
          }
          test "$STAGING_SUPABASE_PROJECT_REF" != "$PROD_REF" || {
            echo "::error::Production project ref detected"
            exit 1
          }

      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply only campaign applications P0 migration
        shell: bash
        run: |
          set +x
          psql "$STAGING_PG_CONN" -X -v ON_ERROR_STOP=1 -1             -f supabase/migrations/20260730133000_campaign_applications_p0_lock_public_insert.sql

      - name: Run rollback regression
        shell: bash
        run: |
          set +x
          psql "$STAGING_PG_CONN" -X -v ON_ERROR_STOP=1             -f scripts/campaign-applications-p0-rls-regression.sql
