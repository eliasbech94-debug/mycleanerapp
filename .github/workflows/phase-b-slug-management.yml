name: Phase B — Slug Management Staging Evidence

# Manually triggered only. Runs scenario 19 (provider slug lifecycle,
# reservations, redirects, RPC permissions) against the staging Supabase
# project. Never runs on push. Never deploys. Never touches production.

on:
  workflow_dispatch:
    inputs:
      run_note:
        description: "Optional free-text note attached to the run"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: phase-b-slug-staging
  cancel-in-progress: false

jobs:
  scenario-19:
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: staging-validation

    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_PG_CONN: ${{ secrets.STAGING_PG_CONN }}
      STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
      RC2_ALLOW_DESTRUCTIVE_STAGING_TESTS: "true"
      RC2_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Diagnostic — dispatch ref context
        run: |
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "github.event.ref=${{ github.event.ref }}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"

      - name: Guard — refuse to run outside the staging branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "staging" ]; then
            echo "This workflow may only run against the staging branch (got ref_name=${GITHUB_REF_NAME}, ref=${GITHUB_REF})."
            exit 1
          fi

      - name: Checkout (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Run Scenario 19 — Slug Management
        run: bun run phaseB:slug | tee evidence-scenario-19.log

      - name: Upload scenario output
        if: always() && hashFiles('staging-validation/evidence-scenario-19.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-scenario-19
          retention-days: 14
          if-no-files-found: warn
          path: staging-validation/evidence-scenario-19.log
