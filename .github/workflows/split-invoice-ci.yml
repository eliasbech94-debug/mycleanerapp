name: Split invoice CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/split-invoice-model]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Split invoice unit test
        run: deno test supabase/functions/_shared/marketplace-fee-split.test.ts
      - name: Edge function typecheck
        run: deno check supabase/functions/invoice-issue-split/index.ts
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
