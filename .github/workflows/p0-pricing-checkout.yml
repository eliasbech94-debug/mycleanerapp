name: P0.1 Pricing & Checkout — Staging Evidence

# Manually triggered only. Runs the RC2 P0.1 evidence scenario against the
# staging environment. Never runs on push. Never deploys. Never touches
# production. See docs/rc/github-development-workflow.md.

on:
  workflow_dispatch:
    inputs:
      run_note:
        description: "Optional free-text note attached to the run"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: p0-1-staging
  cancel-in-progress: false

jobs:
  p0-1:
    # Hard gate: this workflow is only allowed on the `staging` branch.
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: staging-validation

    env:
      # Wired from GitHub encrypted secrets. Never echoed.
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_PG_CONN: ${{ secrets.STAGING_PG_CONN }}
      STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_URL: ${{ secrets.STRIPE_WEBHOOK_URL }}
      SUMSUB_APP_TOKEN: ${{ secrets.SUMSUB_APP_TOKEN }}
      SUMSUB_SECRET_KEY: ${{ secrets.SUMSUB_SECRET_KEY }}
      SUMSUB_WEBHOOK_SECRET: ${{ secrets.SUMSUB_WEBHOOK_SECRET }}
      SUMSUB_WEBHOOK_URL: ${{ secrets.SUMSUB_WEBHOOK_URL }}
      TEST_EMAIL_DOMAIN: ${{ secrets.TEST_EMAIL_DOMAIN }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      RC2_ALLOW_DESTRUCTIVE_STAGING_TESTS: "true"
      RC2_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Guard — refuse to run outside the staging branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/staging" ]; then
            echo "This workflow may only run against refs/heads/staging (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Checkout (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Run P0.1 pricing & checkout evidence
        # Scenario 16 runs its own redactor self-check before any network
        # call and fails the run if a canary leaks. rc2.json / report.json /
        # report.md are written to staging-validation/evidence/<RUN_ID>/.
        run: bun run rc2:p0.1

      - name: Verify redacted evidence exists
        if: always()
        run: |
          set -e
          ls -R evidence/"${RC2_RUN_ID}" || (echo "No evidence produced"; exit 1)
          test -f "evidence/${RC2_RUN_ID}/report.json" || (echo "report.json missing"; exit 1)

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-1-staging-evidence
          retention-days: 14
          if-no-files-found: error
          # Only redacted machine-readable + markdown summaries. No raw
          # HTTP transcripts, screenshots or .env files.
          path: |
            staging-validation/evidence/**/reports/rc2.json
            staging-validation/evidence/**/report.json
            staging-validation/evidence/**/report.md
            staging-validation/evidence/**/manifest.json
          # Never upload:
          #   - .env / .env.*
          #   - evidence/**/http/**
          #   - evidence/**/screenshots/**
